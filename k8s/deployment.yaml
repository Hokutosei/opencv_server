apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencv-server
  labels:
    app: opencv-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencv-server
  template:
    metadata:
      labels:
        app: opencv-server
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: opencv-server
          image: ghcr.io/hokutosei/opencv_server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: DB_PATH
              value: "/data/cameras.db"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opencv-server-data
      nodeSelector:
        kubernetes.io/arch: amd64
